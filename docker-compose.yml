services:
  # Base de datos local. Solo arranca con COMPOSE_PROFILES=local-db (ver .env.example).
  # Si ya tienes tu propia base PostgreSQL (Supabase, etc.), no actives ese perfil y define DATABASE_URL en .env.
  db:
    profiles: ["local-db"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: about_me
      POSTGRES_USER: about_me
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U about_me -d about_me"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin `ports`: la base solo es accesible desde la app, no desde tu red.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false   # sin el perfil local-db, la app usa la base externa
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Define APP_KEY en .env (genérala con php artisan key:generate --show)}"
      # Tu DATABASE_URL del .env tiene prioridad; si no existe, usa la base local del perfil local-db.
      DATABASE_URL: ${DATABASE_URL:-postgres://about_me:${POSTGRES_PASSWORD:-}@db:5432/about_me}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_ON_EMPTY: "true"
      ADMIN_USERNAME: "${ADMIN_USERNAME:?Define ADMIN_USERNAME en .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}"
      # false en local (http://localhost); true detrás de HTTPS.
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
    # Sin capacidades de Linux y sin poder ganar privilegios: es lo que hacen plataformas como Render, y así la integración
    # continua detecta a tiempo un binario que solo arranca con privilegios de más (así falló el primer despliegue).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Solo tu equipo: sin la dirección 127.0.0.1 Docker publicaría el puerto en TODAS las interfaces de tu red.
      - "127.0.0.1:${APP_PORT:-8080}:10000"

volumes:
  pgdata:
