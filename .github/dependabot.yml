# Actualizaciones automáticas: llegan como solicitudes de cambio que la integración continua (ci.yml) prueba solas.
# Las reglas `ignore` no son descuido, son decisiones (ver docs/decisions/0002-migracion-a-laravel-filament.md).
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Hermosillo
    open-pull-requests-limit: 5
    groups:
      # Los parches y menores se agrupan en una sola solicitud para no recibir una por paquete.
      composer-menores-y-parches:
        update-types: [minor, patch]
    ignore:
      # Un salto de versión mayor del framework, del panel o de las pruebas se decide y se prueba a mano.
      - dependency-name: laravel/framework
        update-types: ["version-update:semver-major"]
      - dependency-name: filament/filament
        update-types: ["version-update:semver-major"]
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Hermosillo

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Hermosillo
    # Ojo: la etiqueta de la imagen base incluye la versión de PHP (`1-php8.4-alpine`); una propuesta que cambie el PHP menor
    # (8.5…) es una decisión, no un parche: revísala y prueba antes de aceptarla.

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Hermosillo
    ignore:
      # NUNCA automático: un cambio de versión mayor de PostgreSQL exige exportar e importar los datos.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
