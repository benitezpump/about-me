name: CI

# Qué verifica, y por qué está aquí y no solo en tu equipo:
#  - Pruebas contra un PostgreSQL REAL (17): en local se usa PGlite, que se comporta distinto en detalles como los
#    códigos de error. Ya hubo un caso (on delete restrict: 23503 en PostgreSQL, 23001 en PGlite).
#  - Node 22 (el de producción, ver .nvmrc), no el que tenga instalado cada quien.
#  - La imagen de Docker y el docker-compose de punta a punta: arrancan, migran, siembran y sirven por HTTP.
#  - El Blueprint de Render (render.yaml) contra el esquema oficial de Render.

on:
  push:
    branches: [master, main]
  pull_request:

# Permisos mínimos: este flujo solo necesita leer el código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Pruebas contra PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Pruebas (cada archivo crea y borra su propia base)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  pglite:
    name: Pruebas con PGlite y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # el modo que se usa en local: que no se desvíe del de PostgreSQL
      - run: npm run build

  audit:
    name: Vulnerabilidades conocidas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Solo lo que va a producción, y solo lo grave: un aviso menor en una herramienta de desarrollo no debe bloquear.
      - run: npm audit --omit=dev --audit-level=high

  render:
    name: Blueprint de Render (render.yaml)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Descarga el esquema oficial de Render y comprueba además reglas propias (sin secretos en el archivo, base de
      # pago, TRUST_PROXY sin `true`…). Si Render endurece su esquema, esto avisa antes de que falle un despliegue.
      - run: pip install --quiet pyyaml jsonschema
      - run: python scripts/validate-render.py render.yaml

  docker:
    name: Imagen Docker y compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROFILES: local-db
      POSTGRES_PASSWORD: ci_postgres_password_123
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-123
      APP_PORT: "3000"
    steps:
      - uses: actions/checkout@v7
      - name: Levantar con docker compose (construye la imagen y espera a que estén sanos)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Comprobaciones de humo (incluye un inicio de sesión real)
        run: bash scripts/smoke.sh http://127.0.0.1:3000
        env:
          SMOKE_ADMIN_USER: ci-admin
          SMOKE_ADMIN_PASSWORD: ci-admin-password-123
      - name: Registros de los contenedores (solo si algo falló)
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Apagar y borrar volúmenes
        if: always()
        run: docker compose down -v
