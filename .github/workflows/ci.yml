name: CI

# Qué verifica, y por qué está aquí y no solo en tu equipo:
#  - Pruebas contra un PostgreSQL REAL (17). El esquema usa restricciones NOT VALID, llaves compuestas y RLS que SQLite no
#    entiende; por eso las pruebas nunca corren contra SQLite.
#  - PHP 8.4 (el de producción, ver Dockerfile), no el que tenga instalado cada quien.
#  - La imagen de Docker y el docker-compose de punta a punta: arrancan, migran, siembran y sirven por HTTP.
#  - El Blueprint de Render (render.yaml) contra el esquema oficial de Render.
#
# ¡Este flujo nunca se ha ejecutado en GitHub! Su primera ejecución lo valida; el trabajo `docker` es lo único que ejercita la
# imagen (Docker estaba apagado cuando se escribió).

on:
  push:
    branches: [master, main]
  pull_request:

# Permisos mínimos: este flujo solo necesita leer el código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: Pruebas contra PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, zip, mbstring
          tools: composer:v2
          coverage: none
      - name: Caché de Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pruebas (borran y recrean el esquema `public` de la base desechable del servicio)
        run: vendor/bin/phpunit
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  audit:
    name: Vulnerabilidades conocidas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, zip
          tools: composer:v2
          coverage: none
      # Usa composer.lock: revisa exactamente lo que se instala en producción.
      - run: composer audit --locked

  render:
    name: Blueprint de Render (render.yaml)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Descarga el esquema oficial de Render y comprueba además reglas propias (sin secretos en el archivo, base de
      # pago, TRUST_PROXY sin `true`, APP_DEBUG apagado…). Si Render endurece su esquema, esto avisa antes de que falle un
      # despliegue.
      - run: pip install --quiet pyyaml jsonschema
      - run: python scripts/validate-render.py render.yaml

  docker:
    name: Imagen Docker y compose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROFILES: local-db
      POSTGRES_PASSWORD: ci_postgres_password_123
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-123
      APP_PORT: "8080"
    steps:
      - uses: actions/checkout@v7
      - name: Clave de aplicación de la prueba (desechable)
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Levantar con docker compose (construye la imagen y espera a que estén sanos)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Comprobaciones de humo
        run: bash scripts/smoke.sh http://127.0.0.1:8080
      - name: Registros de los contenedores (solo si algo falló)
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Apagar y borrar volúmenes
        if: always()
        run: docker compose down -v
